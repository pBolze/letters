<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Learning</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    text-align: center;
    background: #f5f7fa;
}

#task {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 20px;
}

canvas {
    background: white;
    border: 3px solid #888;
    border-radius: 16px;
    touch-action: none;
}

.controls {
    margin-top: 15px;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 10px;
    border: none;
    background: #4a90e2;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #357bd8;
}

#result {
    font-size: 30px;
    min-height: 50px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="task"></div>

<canvas id="canvas" width="500" height="350"></canvas>

<div class="controls">
    <button id="checkBtn">Check</button>
    <button id="nextBtn">Next Letter</button>
    <button id="clearBtn">Clear</button>
</div>

<div id="result"></div>

<script>

const LETTERS = ["A","B","C","D","E","F","G","H"];

const NUM_POINTS = 64;
const SQUARE_SIZE = 250;

let expectedLetter = "";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.lineWidth = 8;
ctx.lineCap = "round";
ctx.strokeStyle = "#222";

let drawing = false;
let strokes = [];
let currentStroke = [];

function getPos(e)
{
    const rect = canvas.getBoundingClientRect();

    if (e.touches)
    {
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        };
    }

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function startDraw(e)
{
    drawing = true;

    currentStroke = [];

    const p = getPos(e);

    currentStroke.push(p);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
}

function moveDraw(e)
{
    if (!drawing) return;

    e.preventDefault();

    const p = getPos(e);

    currentStroke.push(p);

    ctx.lineTo(p.x, p.y);
    ctx.stroke();
}

function endDraw()
{
    if (!drawing) return;

    drawing = false;

    if (currentStroke.length > 1)
    {
        strokes.push(currentStroke);
    }
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", moveDraw);
canvas.addEventListener("mouseup", endDraw);
canvas.addEventListener("mouseleave", endDraw);

canvas.addEventListener("touchstart", startDraw);
canvas.addEventListener("touchmove", moveDraw);
canvas.addEventListener("touchend", endDraw);

function chooseNextLetter()
{
    expectedLetter =
        LETTERS[Math.floor(Math.random() * LETTERS.length)];

    document.getElementById("task").textContent =
        `Write letter '${expectedLetter}'`;

    document.getElementById("result").textContent = "";

    clearCanvas();
}

function clearCanvas()
{
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes = [];
}

function distance(a,b)
{
    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);
}

function pathLength(points)
{
    let d = 0;

    for(let i=1;i<points.length;i++)
    {
        d += distance(points[i-1], points[i]);
    }

    return d;
}

function centroid(points)
{
    let x = 0;
    let y = 0;

    for(const p of points)
    {
        x += p.x;
        y += p.y;
    }

    return {
        x: x / points.length,
        y: y / points.length
    };
}

function resample(points, n)
{
    const I = pathLength(points) / (n - 1);

    let D = 0;
    const newPoints = [points[0]];

    for(let i=1;i<points.length;i++)
    {
        const d = distance(points[i-1], points[i]);

        if((D+d) >= I)
        {
            const qx =
                points[i-1].x +
                ((I-D)/d) *
                (points[i].x - points[i-1].x);

            const qy =
                points[i-1].y +
                ((I-D)/d) *
                (points[i].y - points[i-1].y);

            const q = {x:qx,y:qy};

            newPoints.push(q);
            points.splice(i,0,q);

            D = 0;
        }
        else
        {
            D += d;
        }
    }

    while(newPoints.length < n)
    {
        newPoints.push(points[points.length-1]);
    }

    return newPoints;
}

function rotateBy(points, theta)
{
    const c = centroid(points);

    return points.map(p => ({
        x:
            (p.x-c.x)*Math.cos(theta) -
            (p.y-c.y)*Math.sin(theta) +
            c.x,

        y:
            (p.x-c.x)*Math.sin(theta) +
            (p.y-c.y)*Math.cos(theta) +
            c.y
    }));
}

function rotateToZero(points)
{
    const c = centroid(points);

    const theta =
        Math.atan2(
            c.y - points[0].y,
            c.x - points[0].x
        );

    return rotateBy(points, -theta);
}

function scaleToSquare(points)
{
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;

    for(const p of points)
    {
        minX = Math.min(minX,p.x);
        minY = Math.min(minY,p.y);
        maxX = Math.max(maxX,p.x);
        maxY = Math.max(maxY,p.y);
    }

    const width = maxX - minX || 1;
    const height = maxY - minY || 1;

    return points.map(p => ({
        x: p.x * (SQUARE_SIZE / width),
        y: p.y * (SQUARE_SIZE / height)
    }));
}

function translateToOrigin(points)
{
    const c = centroid(points);

    return points.map(p => ({
        x: p.x - c.x,
        y: p.y - c.y
    }));
}

function normalize(points)
{
    points = resample([...points], NUM_POINTS);
    points = rotateToZero(points);
    points = scaleToSquare(points);
    points = translateToOrigin(points);

    return points;
}

function pathDistance(a,b)
{
    let d = 0;

    for(let i=0;i<a.length;i++)
    {
        d += distance(a[i], b[i]);
    }

    return d / a.length;
}

function flattenStrokes(strokes)
{
    return strokes.flat();
}

function reverseStroke(stroke)
{
    return [...stroke].reverse();
}

function generateVariants(strokes)
{
    return [
        strokes,
        [...strokes].reverse(),
        strokes.map(reverseStroke),
        [...strokes].reverse().map(reverseStroke)
    ];
}

function scoreAgainstTemplate(userStrokes, templateStrokes)
{
    let best = Infinity;

    const userVariants = generateVariants(userStrokes);
    const templateVariants = generateVariants(templateStrokes);

    for(const uv of userVariants)
    {
        for(const tv of templateVariants)
        {
            const u = normalize(flattenStrokes(uv));
            const t = normalize(flattenStrokes(tv));

            best = Math.min(
                best,
                pathDistance(u,t)
            );
        }
    }

    return best;
}

const templates =
[
{
    name:"A",
    strokes:[
        [{x:60,y:260},{x:150,y:40}],
        [{x:150,y:40},{x:240,y:260}],
        [{x:95,y:160},{x:205,y:160}]
    ]
},

{
    name:"B",
    strokes:[
        [{x:70,y:40},{x:70,y:260}],
        [{x:70,y:40},{x:190,y:80},{x:70,y:150}],
        [{x:70,y:150},{x:190,y:210},{x:70,y:260}]
    ]
},

{
    name:"C",
    strokes:[
        [{x:220,y:60},{x:140,y:40},{x:70,y:90},{x:50,y:170},{x:90,y:240},{x:170,y:270},{x:230,y:240}]
    ]
},

{
    name:"D",
    strokes:[
        [{x:70,y:40},{x:70,y:260}],
        [{x:70,y:40},{x:210,y:90},{x:210,y:210},{x:70,y:260}]
    ]
},

{
    name:"E",
    strokes:[
        [{x:70,y:40},{x:70,y:260}],
        [{x:70,y:40},{x:220,y:40}],
        [{x:70,y:150},{x:180,y:150}],
        [{x:70,y:260},{x:220,y:260}]
    ]
},

{
    name:"F",
    strokes:[
        [{x:70,y:40},{x:70,y:260}],
        [{x:70,y:40},{x:220,y:40}],
        [{x:70,y:150},{x:180,y:150}]
    ]
},

{
    name:"G",
    strokes:[
        [{x:220,y:70},{x:140,y:40},{x:70,y:80},{x:50,y:170},{x:90,y:240},{x:180,y:260},{x:220,y:200},{x:160,y:200}]
    ]
},

{
    name:"H",
    strokes:[
        [{x:70,y:40},{x:70,y:260}],
        [{x:220,y:40},{x:220,y:260}],
        [{x:70,y:150},{x:220,y:150}]
    ]
}
];

document.getElementById("checkBtn")
.addEventListener("click", () =>
{
    const result =
        document.getElementById("result");

    if (strokes.length === 0)
    {
        result.textContent =
            "Draw something first.";
        return;
    }

    const scores = [];

    for (const template of templates)
    {
        const score =
            scoreAgainstTemplate(
                strokes,
                template.strokes
            );

        scores.push({
            letter: template.name,
            score: score
        });
    }

    scores.sort((a, b) => a.score - b.score);

    const best =
        scores[0];

    let html =
        `<div><b>Best Match: ${best.letter}</b></div><br>`;

    for (const entry of scores)
    {
        const scoreText =
            entry.score.toFixed(1);

        if (entry === best)
        {
            html +=
                `<div style="font-size:22px;
                             color:green;
                             font-weight:bold;">
                    ⭐ ${entry.letter}: ${scoreText}
                 </div>`;
        }
        else
        {
            html +=
                `<div>
                    ${entry.letter}: ${scoreText}
                 </div>`;
        }
    }

    html += "<hr>";

    const expected =
        scores.find(
            x => x.letter === expectedLetter
        );

    if (expected.score < 40)
    {
        html +=
            "<div>⭐ Excellent!</div>";
    }
    else if (expected.score < 65)
    {
        html +=
            "<div>😊 Good job!</div>";
    }
    else if (expected.score < 95)
    {
        html +=
            "<div>👍 Almost!</div>";
    }
    else
    {
        html +=
            "<div>✏️ Try again!</div>";
    }

    result.innerHTML = html;
});

document.getElementById("clearBtn")
.addEventListener("click", () =>
{
    clearCanvas();
    document.getElementById("result").textContent = "";
});

document.getElementById("nextBtn")
.addEventListener("click", chooseNextLetter);

chooseNextLetter();

</script>

</body>
</html>
